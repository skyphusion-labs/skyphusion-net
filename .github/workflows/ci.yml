name: CI

# Deploy the site to Cloudflare on pushes to main. GitHub-hosted, fork-safe
# (no self-hosted runner): skyphusion-net is a public repo, so a self-hosted
# fleet runner would let fork PRs execute on a build box, and GitHub refuses to
# dispatch public-repo jobs to a runner group that disallows public repos
# anyway. This is just an Astro build + wrangler deploy with no fleet need.
# The `ci` job (typecheck + build + vitest) satisfies the org required check on PRs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - run: npm run typecheck

      - name: Build Astro site
        run: npm run build

      # Fully prerendered site: serve dist/client statically. `astro preview` with
      # the Cloudflare adapter does not reliably bind :4321 in CI, which flakes
      # blog.test.ts (ECONNREFUSED) and blocks the deploy job.
      - name: Start static preview server
        run: npx --yes serve dist/client -l 4321 &

      - name: Wait for preview server
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null 2>&1; then
              echo "ready on attempt $i"
              exit 0
            fi
            sleep 1
          done
          echo "preview never became ready"
          exit 1

      - name: Run blog tests
        run: npx vitest run

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

  # public/ask-widget.js must equal the @skyphusion/search-mcp version declared in
  # scripts/ask-widget.canonical.json (fetched from the npm registry), plus the one declared
  # divergence in scripts/ask-widget.divergence.diff. Its own job so a registry hiccup never
  # sits on the deploy path; it needs node only, no install.
  ask-widget-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Ask widget matches its declared search-mcp version
        run: node scripts/check-ask-widget.mjs
